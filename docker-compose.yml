services:
  backend:
    build: ./app
    ports:
      - "8000:8000"
    env_file:
      - ./app/keys.env
    environment:
      - CORS_ORIGINS=http://localhost:5173
    volumes:
      - ./app/storage:/app/storage

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend